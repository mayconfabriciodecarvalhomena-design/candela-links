<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Candela</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Three.js vía CDN + import map, sin bundler -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- El envío de mensajes ya no vive en un widget flotante aparte:
       está integrado en la última página de la carta (ver
       src/letterWriteControls.js), con sus propios elementos DOM
       creados dinámicamente por JS — igual criterio que las flechas de
       pasar página (src/letterPageControls.js) o la etiqueta del gato
       (src/catHover.js), ninguna de las cuales vive tampoco en este
       HTML. -->

  <script type="module" src="src/main.js"></script>
</body>
</html>
